services:
  postgres:
    image: postgres:16-alpine
    container_name: peopleos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: peopleos
      POSTGRES_PASSWORD: peopleos
      POSTGRES_DB: peopleos
    ports:
      - "5440:5432"
    volumes:
      - peopleos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleos -d peopleos"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: peopleos-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  peopleos_pg_data:
